# Step 1: connected monitor layout. Use exact modes reported by hyprctl.
monitor = desc:ASUSTek COMPUTER INC VG27B L2LMQS041890, 2560x1440@143.97, 1440x0, 1
monitor = desc:ASUSTek COMPUTER INC VG27B K7LMQS089435, 2560x1440@143.97, 4000x0, 1

# Safe fallback for any output not matched above.
monitor = , preferred, auto, 1

$sky = rgb(91d7e3)
$base = rgb(24273a)
$lavender = rgb(b7bdf8)
$mellow_red = rgb(c66a73)
$mainMod = SUPER
$terminal = alacritty
$browser = google-chrome-stable
$appLauncher = rofi -show drun

# Step 2: input behavior and static appearance.
input {
    sensitivity = -0.8
    follow_mouse = 0
    float_switch_override_focus = 2
    kb_layout = se
    kb_options = caps:escape
}

cursor {
    no_warps = true
}

general {
    gaps_in = 2
    gaps_out = 2
    border_size = 1
    col.active_border = $sky
    col.inactive_border = $base
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 30
    hover_icon_on_border = true

    snap {
        enabled = true
    }
}

decoration {
    active_opacity = 1
    rounding = 2

    blur {
        size = 5
        passes = 2
        xray = true
    }

    shadow {
        enabled = false
    }
}

misc {
    font_family = JetBrainsMono Nerd Font
    splash_font_family = JetBrainsMono Nerd Font
    disable_hyprland_logo = true
    col.splash = $lavender
}

# Step 4: animations and workspace placement.
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

workspace = 1, monitor:desc:ASUSTek COMPUTER INC VG27B L2LMQS041890, persistent:true, default:true
workspace = 2, monitor:desc:ASUSTek COMPUTER INC VG27B L2LMQS041890
workspace = 3, monitor:desc:ASUSTek COMPUTER INC VG27B L2LMQS041890
workspace = 4, monitor:desc:ASUSTek COMPUTER INC VG27B K7LMQS089435, persistent:true, default:true
workspace = 5, monitor:desc:ASUSTek COMPUTER INC VG27B K7LMQS089435
workspace = 6, monitor:desc:ASUSTek COMPUTER INC VG27B K7LMQS089435
workspace = 7, monitor:desc:ASUSTek COMPUTER INC VG27B K7LMQS089435
workspace = 8, monitor:desc:ASUSTek COMPUTER INC VG27B K7LMQS089435, persistent:true, default:true
workspace = 9, monitor:desc:ASUSTek COMPUTER INC VG27B K7LMQS089435
workspace = 10, monitor:desc:ASUSTek COMPUTER INC VG27B K7LMQS089435
workspace = special:special-obsidian, monitor:desc:ASUSTek COMPUTER INC VG27B K7LMQS089435, gapsout:15

# Step 5a: generic window behavior.
windowrule {
    name = suppress-fullscreen-events
    suppress_event = fullscreen
    match:class = .*
}

windowrule {
    name = fix-xwayland-drags
    no_focus = true
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
}

windowrule {
    name = fullscreen-games
    fullscreen = true
    workspace = 2
    match:class = ^(steam_app_.*|gow[.]exe)$
}

windowrule {
    name = float-utility-apps
    float = true
    match:class = ^(org[.]pulseaudio[.]pavucontrol|dev[.]jimmy[.]opengl_game|blueman-manager|CachyOSHello|zenity|org[.]gnome[.]Calculator)$
}

windowrule {
    name = float-empty-class-dialogs
    float = true
    match:class = ^$
    match:title = ^(Picture in picture|Save File|Open File)$
}

windowrule {
    name = float-librewolf-pip
    float = true
    match:class = ^LibreWolf$
    match:title = ^Picture-in-Picture$
}

windowrule {
    name = float-portals
    float = true
    match:class = ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland).*$
}

windowrule {
    name = float-polkit
    float = true
    match:class = ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org[.]kde[.]polkit-kde-authentication-agent-1).*$
}

windowrule {
    name = float-steam-friends
    float = true
    match:class = ^steam$
    match:title = ^Friends List$
}

windowrule {
    name = float-steam-updater
    float = true
    match:class = ^$
    match:title = ^Steam - Self Updater$
}

windowrule {
    name = opacity-file-managers
    opacity = 0.92
    match:class = ^(thunar|nemo)$
}

windowrule {
    name = opacity-chat
    opacity = 0.96
    match:class = ^(discord|armcord|webcord)$
}

windowrule {
    name = opacity-messaging
    opacity = 0.95
    match:title = ^(QQ|Telegram)$
}

windowrule {
    name = opacity-music
    opacity = 0.95
    match:title = ^NetEase Cloud Music Gtk4$
}

windowrule {
    name = picture-in-picture
    float = true
    size = 960 540
    move = monitor_w*0.25 monitor_h*0.25
    match:title = ^Picture-in-Picture$
}

windowrule {
    name = floating-media
    float = true
    size = 960 540
    move = monitor_w*0.25 monitor_h*0.25
    match:title = ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
}

windowrule {
    name = pin-danmufloat
    pin = true
    match:title = ^danmufloat$
}

windowrule {
    name = round-floating-tools
    rounding = 5
    match:title = ^(danmufloat|termfloat)$
}

windowrule {
    name = animate-terminals
    animation = slide right
    match:class = ^(kitty|Alacritty|ghostty|wezterm)$
}

workspace = w[t1], gapsout:0, gapsin:0
workspace = w[tg1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule {
    name = smart-gaps-tiled
    border_size = 0
    rounding = 0
    match:float = false
    match:workspace = w[t1]
}

windowrule {
    name = smart-gaps-grouped
    border_size = 0
    rounding = 0
    match:float = false
    match:workspace = w[tg1]
}

windowrule {
    name = smart-gaps-fullscreen
    border_size = 0
    rounding = 0
    match:float = false
    match:workspace = f[1]
}

# Step 5b: application routing and special workspaces.
windowrule {
    name = highlight-special-obsidian
    border_size = 3
    border_color = $mellow_red $mellow_red
    match:workspace = special:special-obsidian
    match:float = false
}

windowrule {
    name = ferdium-workspace
    workspace = 4 silent
    match:class = ^Ferdium$
}

windowrule {
    name = spotify-workspace
    workspace = special:special-obsidian silent
    match:class = ^Spotify$
}

windowrule {
    name = steam-workspace
    workspace = 6 silent
    match:class = ^steam$
}

windowrule {
    name = thunderbird-workspace
    workspace = 7 silent
    match:class = ^thunderbird$
}

windowrule {
    name = obsidian-workspace
    workspace = special:special-obsidian silent
    match:class = ^(obsidian|md[.]obsidian[.]Obsidian)$
}

# Step 3: essential application, window, and workspace bindings.
bindd = $mainMod, RETURN, Open terminal, exec, $terminal
bindd = $mainMod CTRL, RETURN, Open terminal, exec, $terminal
bindd = $mainMod, B, Open browser, exec, $browser
bindd = $mainMod, SPACE, Open application launcher, exec, $appLauncher
bindd = $mainMod, Q, Close active window, killactive,
bindd = $mainMod, V, Toggle floating, togglefloating,
bindd = $mainMod, M, Toggle fullscreen, fullscreen,
bindd = $mainMod, Y, Pin active window, pin,
bindd = $mainMod, S, Rotate dwindle split, layoutmsg, rotatesplit
bindd = $mainMod, Tab, Focus next grouped window, changegroupactive, f
bindd = $mainMod CTRL, L, Lock screen, exec, hyprlock
bindd = $mainMod SHIFT, S, Capture selected area, exec, /home/jimmy/.config/hypr/scripts/screenshot_area.sh
bindd = $mainMod, Print, Capture current output, exec, /home/jimmy/.config/hypr/scripts/screenshot.sh
bindd = $mainMod CTRL, P, Reload Waybar, exec, killall -SIGUSR2 waybar

bindd = $mainMod, left, Move focus left, movefocus, l
bindd = $mainMod, right, Move focus right, movefocus, r
bindd = $mainMod, up, Move focus up, movefocus, u
bindd = $mainMod, down, Move focus down, movefocus, d
bindd = $mainMod, H, Move focus left, movefocus, l
bindd = $mainMod, L, Move focus right, movefocus, r
bindd = $mainMod, K, Move focus up, movefocus, u
bindd = $mainMod, J, Move focus down, movefocus, d

bindd = $mainMod SHIFT, left, Move window left, movewindow, l
bindd = $mainMod SHIFT, right, Move window right, movewindow, r
bindd = $mainMod SHIFT, up, Move window up, movewindow, u
bindd = $mainMod SHIFT, down, Move window down, movewindow, d
bindd = $mainMod SHIFT, H, Move window left, movewindow, l
bindd = $mainMod SHIFT, L, Move window right, movewindow, r
bindd = $mainMod SHIFT, K, Move window up, movewindow, u
bindd = $mainMod SHIFT, J, Move window down, movewindow, d

bindd = $mainMod CTRL SHIFT, right, Resize window right, resizeactive, 15 0
bindd = $mainMod CTRL SHIFT, left, Resize window left, resizeactive, -15 0
bindd = $mainMod CTRL SHIFT, up, Resize window up, resizeactive, 0 -15
bindd = $mainMod CTRL SHIFT, down, Resize window down, resizeactive, 0 15
bindd = $mainMod CTRL SHIFT, L, Resize window right, resizeactive, 15 0
bindd = $mainMod CTRL SHIFT, H, Resize window left, resizeactive, -15 0
bindd = $mainMod CTRL SHIFT, K, Resize window up, resizeactive, 0 -15
bindd = $mainMod CTRL SHIFT, J, Resize window down, resizeactive, 0 15

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
bindd = $mainMod, 5, Switch to workspace 5, workspace, 5
bindd = $mainMod, 6, Switch to workspace 6, workspace, 6
bindd = $mainMod, 7, Switch to workspace 7, workspace, 7
bindd = $mainMod, 8, Switch to workspace 8, workspace, 8
bindd = $mainMod, 9, Switch to workspace 9, workspace, 9
bindd = $mainMod, 0, Switch to workspace 10, workspace, 10

bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspacesilent, 10

bindd = $mainMod, PERIOD, Next workspace, workspace, e+1
bindd = $mainMod, COMMA, Previous workspace, workspace, e-1
bindd = $mainMod, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, e-1
bindd = $mainMod, slash, Previously used workspace, workspace, previous
bindd = $mainMod, minus, Move window to special workspace, movetoworkspace, special
bindd = $mainMod, plus, Toggle special workspace, togglespecialworkspace, special
bindd = $mainMod, F1, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = $mainMod ALT SHIFT, F1, Move window to scratchpad, movetoworkspacesilent, special:scratchpad
bindd = $mainMod, O, Toggle Obsidian workspace, togglespecialworkspace, special-obsidian

binds {
    allow_workspace_cycles = true
    workspace_back_and_forth = true
    workspace_center_on = 1
    movefocus_cycles_fullscreen = true
    window_direction_monitor_fallback = true
}

# Portals and the enabled Hyprpaper, Hypridle, and polkit services are systemd-owned.
exec-once = waybar
exec-once = mako
