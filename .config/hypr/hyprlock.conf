$base = rgb(24273a)
$surface0 = rgb(363a4f)
$text = rgb(cad3f5)
$mauve = rgb(c6a0f6)
$red = rgb(ed8796)
$yellow = rgb(eed49f)
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor = ASUSTek COMPUTER INC VG27AQ1A LALMQS099884
    path = /home/jimmy/Pictures/wallpapers/wallhaven-Mountains_1440x2560.png
    color = $base
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
    vibrancy_darkness = 0
}

background {
    monitor = ASUSTek COMPUTER INC VG27B L2LMQS041890
    path = /home/jimmy/Pictures/wallpapers/wallhaven-Cat_by_water_2560x1440.png
    color = $base
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
    vibrancy_darkness = 0
}

background {
    monitor = ASUSTek COMPUTER INC VG27B K7LMQS089435
    path = /home/jimmy/Pictures/wallpapers/wallhaven-Space_galaxy_2560x1440.png
    color = $base
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
    vibrancy_darkness = 0
}

label {
    monitor = ASUSTek COMPUTER INC VG27B L2LMQS041890
    text = $TIME
    color = $text
    font_size = 90
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor = ASUSTek COMPUTER INC VG27B L2LMQS041890
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = $text
    font_size = 25
    font_family = $font
    position = 0, 300
    halign = center
    valign = center
}

input-field {
    monitor = ASUSTek COMPUTER INC VG27B L2LMQS041890
    size = 300, 60
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    fade_on_empty = true
    hide_input = false
    check_color = $mauve
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -50
    halign = center
    valign = center
}
